---
- name: update cache
  ansible.builtin.apt:
    update_cache: true
  become: true

- name: update package
  ansible.builtin.apt:
    upgrade: "{{ install_apt_packages_upgrade | default(true) }}"
  become: true

- name: install apt packages
  ansible.builtin.apt:
    name: '{{ apt_packages }}'
    state: latest
  when: apt_packages is defined
  become: true
